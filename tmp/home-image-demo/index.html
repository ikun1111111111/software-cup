<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>首页图片替换 Demo</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f5eee1;
        --ink: #2a2520;
        --muted: #756b5d;
        --red: #c84b31;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(rgba(255, 255, 255, 0.54), rgba(255, 255, 255, 0.54)),
          repeating-linear-gradient(0deg, transparent 0 7px, rgba(42, 37, 32, 0.035) 7px 8px),
          repeating-linear-gradient(90deg, transparent 0 7px, rgba(42, 37, 32, 0.03) 7px 8px),
          var(--paper);
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
        color: var(--ink);
      }

      main {
        width: min(100vw, 900px);
        padding: 36px 24px;
        box-sizing: border-box;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 30px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .rule {
        width: 100%;
        height: 3px;
        background: var(--red);
        margin-bottom: 28px;
      }

      .stage {
        display: flex;
        justify-content: center;
      }

      .phone {
        width: 390px;
        border-radius: 34px;
        overflow: hidden;
        background: #fffdf7;
        box-shadow: 0 24px 60px rgba(42, 37, 32, 0.18);
        border: 1px solid rgba(42, 37, 32, 0.12);
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>首页图片替换 Demo</h1>
      <p>把首页 emoji / 单字缩略按钮替换成真实图片素材后的方向预览。</p>
      <div class="rule"></div>
      <div class="stage">
        <div class="phone">
          <img src="./home-image-replace-demo.png" alt="首页图片替换 Demo" />
        </div>
      </div>
    </main>
  </body>
</html>
