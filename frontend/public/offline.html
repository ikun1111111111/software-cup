<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线模式 - 灵山胜境</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    
    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 15px;
      color: #667eea;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #666;
      margin-bottom: 25px;
    }
    
    .features {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: left;
    }
    
    .features h3 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #333;
    }
    
    .features ul {
      list-style: none;
      padding: 0;
    }
    
    .features li {
      padding: 8px 0;
      color: #555;
      display: flex;
      align-items: center;
    }
    
    .features li::before {
      content: '✓';
      color: #667eea;
      font-weight: bold;
      margin-right: 10px;
    }
    
    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }
    
    button {
      flex: 1;
      padding: 14px 24px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn-secondary {
      background: #f0f0f0;
      color: #667eea;
    }
    
    .btn-secondary:hover {
      background: #e0e0e0;
    }
    
    .status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    .status.online {
      background: #d4edda;
      color: #155724;
    }
    
    .status.offline {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>您已离线</h1>
    <p>当前无法连接到网络，但您仍可以使用以下功能</p>
    
    <div class="features">
      <h3>离线可用功能</h3>
      <ul>
        <li>已缓存的景点信息</li>
        <li>已下载的语音讲解</li>
        <li>离线问答知识库</li>
        <li>本地地图浏览</li>
      </ul>
    </div>
    
    <div class="buttons">
      <button class="btn-primary" onclick="retryConnection()">重新连接</button>
      <button class="btn-secondary" onclick="viewOfflineContent()">查看离线内容</button>
    </div>
    
    <div id="status" class="status"></div>
  </div>

  <script>
    // Check online status
    function updateOnlineStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.textContent = '✓ 网络已恢复，可以正常使用所有功能';
        statusEl.className = 'status show online';
      } else {
        statusEl.textContent = '✗ 网络未连接，请使用离线功能';
        statusEl.className = 'status show offline';
      }
    }
    
    // Retry connection
    function retryConnection() {
      updateOnlineStatus();
      if (navigator.onLine) {
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      }
    }
    
    // View offline content
    function viewOfflineContent() {
      // Navigate to offline content page or show cached data
      window.location.href = '/?offline=true';
    }
    
    // Listen for online/offline events
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // Initial check
    updateOnlineStatus();
  </script>
</body>
</html>
