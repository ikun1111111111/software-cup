<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 140" width="512" height="140">
  <defs>
    <linearGradient id="grad-song" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D0E8E0"/>
      <stop offset="100%" stop-color="#8BB8A8"/>
    </linearGradient>
  </defs>
  <!-- 外发光层 1 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="#D0E8E0" opacity="0.25" style="letter-spacing: 18px;"
        transform="translate(256,105) scale(1.08) translate(-256,-105)">北宋</text>
  <!-- 外发光层 2 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="#D0E8E0" opacity="0.5" style="letter-spacing: 18px;"
        transform="translate(256,105) scale(1.04) translate(-256,-105)">北宋</text>
  <!-- 描边层 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="none" stroke="#2A4D3E" stroke-width="5" style="letter-spacing: 18px;">北宋</text>
  <!-- 主文字 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="url(#grad-song)" style="letter-spacing: 18px;">北宋</text>
</svg>