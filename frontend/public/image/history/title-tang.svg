<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 140" width="512" height="140">
  <defs>
    <linearGradient id="grad-tang" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E0"/>
      <stop offset="40%" stop-color="#F0C878"/>
      <stop offset="100%" stop-color="#C89440"/>
    </linearGradient>
  </defs>
  <!-- 外发光层 1（最淡最大） -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="#F0C878" opacity="0.22" style="letter-spacing: 18px;"
        transform="translate(256,105) scale(1.08) translate(-256,-105)">盛唐</text>
  <!-- 外发光层 2 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="#F0C878" opacity="0.45" style="letter-spacing: 18px;"
        transform="translate(256,105) scale(1.04) translate(-256,-105)">盛唐</text>
  <!-- 描边层 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="none" stroke="#8B4513" stroke-width="5" style="letter-spacing: 18px;">盛唐</text>
  <!-- 主文字 -->
  <text x="256" y="105" text-anchor="middle"
        font-family="'KaiTi','STKaiti','serif'" font-size="110" font-weight="bold"
        fill="url(#grad-tang)" style="letter-spacing: 18px;">盛唐</text>
</svg>